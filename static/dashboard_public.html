<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Afi Vision — Public Live Dashboard</title>
  <link rel="icon" href="/static/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=Poppins:wght@400;600;700&family=Roboto:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=4.7">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #090d16;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    .public-viewport {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #090d16;
      overflow: hidden;
      transition: background-color 0.2s ease;
    }
    .public-viewport.builder-light-mode {
      background: #f1f5f9;
    }
    .public-canvas-wrapper {
      position: relative;
      transform-origin: center center;
      transition: transform 0.12s ease-out;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7);
      border-radius: 10px;
    }
    /* Floating topbar on hover */
    .public-floating-bar {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(-70px);
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 99999;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    .public-viewport:hover .public-floating-bar,
    .public-floating-bar:hover,
    .public-floating-bar.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
      pointer-events: auto;
    }
    .public-dash-badge {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11.5px;
      font-weight: 600;
      color: #38bdf8;
    }
    .public-dash-badge .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      display: inline-block;
      animation: pulseDot 2s infinite ease-in-out;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .public-action-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #ffffff;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.12s ease;
      text-decoration: none;
    }
    .public-action-btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
      color: #ffffff;
    }
    .public-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(50px);
      background: #0284c7;
      color: #ffffff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      z-index: 100000;
      opacity: 0;
      transition: all 0.2s ease;
      pointer-events: none;
    }
    .public-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="dashboard-builder-view mode-preview">
  <div class="dashboard-builder-view mode-preview public-viewport" id="publicViewport">
    <!-- Floating Bar on Hover -->
    <div class="public-floating-bar" id="publicFloatingBar">
      <div class="public-dash-badge">
        <span class="status-dot"></span>
        <span id="publicDashTitle">Afi Vision Live Dashboard</span>
      </div>
      <button class="public-action-btn" id="btnCopyPublicLink" type="button" title="Salin tautan dashboard publik ke clipboard">
        📋 Salin Tautan
      </button>
      <button class="public-action-btn" id="btnToggleFullscreen" type="button" title="Mode Layar Penuh">
        ⛶ Layar Penuh
      </button>
      <a class="public-action-btn" id="linkBackToEditor" href="/" title="Buka dan edit dashboard ini di Studio Editor">
        ⚙️ Buka di Editor
      </a>
    </div>

    <!-- Scaled Canvas Container (Auto-Fit Contain on TV) -->
    <div class="public-canvas-wrapper" id="publicCanvasWrapper">
      <div class="builder-canvas public-canvas" id="publicCanvas"></div>
    </div>
  </div>

  <div class="public-toast" id="publicToast">Tautan publik berhasil disalin ke clipboard!</div>

  <!-- Load the unified DashboardBuilder engine -->
  <script src="/static/dashboard_builder.js?v=2.9"></script>

  <script>
    (async function() {
      // 1. Get Dashboard ID from URL path or query
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      let dashId = 'default';
      const pubIdx = pathParts.indexOf('public');
      if (pubIdx !== -1 && pathParts[pubIdx + 1]) {
        dashId = pathParts[pubIdx + 1];
      } else if (pathParts.length > 0) {
        dashId = pathParts[pathParts.length - 1];
      }
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('id')) dashId = urlParams.get('id');

      // Link Back to Editor
      const linkEditor = document.getElementById('linkBackToEditor');
      if (linkEditor) linkEditor.href = `/?tab=dashboard&dash=${encodeURIComponent(dashId)}`;

      // 2. Auto-Fit Function for TV / Displays
      window.autoFitPublicCanvas = function() {
        const canvas = document.getElementById('publicCanvas') || document.getElementById('builderCanvas');
        const wrapper = document.getElementById('publicCanvasWrapper');
        const viewport = document.getElementById('publicViewport');
        if (!canvas || !wrapper || !viewport) return;

        const cw = canvas.offsetWidth || (window.dashboardBuilder?.state?.layout?.canvas?.width) || 1440;
        const ch = canvas.offsetHeight || (window.dashboardBuilder?.state?.layout?.canvas?.height) || 960;
        const vw = viewport.clientWidth - 32;
        const vh = viewport.clientHeight - 32;

        const scale = Math.min(vw / cw, vh / ch);
        wrapper.style.transform = `scale(${Math.min(1.5, Math.max(0.2, scale))})`;
      };

      window.addEventListener('resize', window.autoFitPublicCanvas);

      // 3. User Actions (Copy Link & Fullscreen)
      document.getElementById('btnCopyPublicLink')?.addEventListener('click', () => {
        navigator.clipboard.writeText(window.location.href);
        showToast('Tautan publik berhasil disalin ke clipboard!');
      });

      document.getElementById('btnToggleFullscreen')?.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      function showToast(msg) {
        const t = document.getElementById('publicToast');
        if (!t) return;
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
      }

      // 4. Initialize DashboardBuilder in Standalone Preview Mode
      if (window.dashboardBuilder) {
        window.dashboardBuilder.state.projectId = dashId;
        window.dashboardBuilder.state.mode = 'preview';
        window.dashboardBuilder.state.isPublicView = true;

        await window.dashboardBuilder.init();
        window.autoFitPublicCanvas();
      }
    })();
  </script>
</body>
</html>
